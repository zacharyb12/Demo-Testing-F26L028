<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div>
        <label>Email</label>
        <input type="text" formControlName="email">
    </div>

    <div>
        <label>Password</label>
        <input type="text" formControlName="password">
    </div>

    <button type="submit">Login</button>

</form>
